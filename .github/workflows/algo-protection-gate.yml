name: Algorithm Protection Gate

# Sprint 5.22 PR #FUL-CRITICAL — site-wide algorithm-substrate non-exposure
# enforcement at customer-facing surfaces.
#
# Per Algorithm_Protection_v1 §6.X NEW (R-3 RATIFIED Pass 2026-05-12):
#   "Customer-facing surfaces MUST NOT name (a) underlying model vendor;
#   (b) underlying model tier or family; (c) Pythia prompt template structure;
#   (d) Themis rule cluster IDs as routing decisions; (e) per-vertical
#   inference ring composition; (f) cost-substrate routing logic. Compute
#   pricing tiers (Standard / Deep / Strategic) are the canonical customer-
#   facing abstraction."
#
# Themis #115.3 Pythia-prompt-template-protection (BINDING)
# Themis #117.2 Answer-substrate-protection (R-2 RATIFIED Pass 2026-05-12)
# Themis #117.12 sales-conversation-scope-bounding (BINDING per R-2)
# Pattern-32 27th-instance NEW class — LIVE-PRODUCT-SURFACE-vs-RATIFIED-
#   CANONICAL-DESIGN divergence remediation gate
# Lesson #28-EXTENSION BINDING-CANDIDATE — algorithm-substrate non-exposure
#   at customer-facing surface depth co-equal to Lesson #28-COO-vendor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  algo-protection-gate:
    name: Banned-language regex gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Banned-language scan (marketing copy must scrub)
        id: scan
        shell: bash
        run: |
          set -o pipefail

          # Allow-listed file paths (legal substrate + crawler directives per §2.2 + §2.3).
          # privacy.html added 2026-06-11: the Phronesis-domain privacy policy
          # (recut §6) — same GDPR Article 28 / CCPA subprocessor-disclosure
          # exemption this list already grants the parent-site legal files.
          ALLOWLIST_REGEX='^(privacy\.html|privacy-policy\.html|terms-of-service\.html|refund-policy\.html|robots\.txt)$'

          # Banned-language patterns (case-insensitive). Match (a) model-vendor +
          # tier/family names; (b) explicit model-id strings; (c) pricing.json
          # algorithm-exposure keys.
          #
          # BANNED_NAMES matches whole words. grep -E has no lookahead: the earlier
          # claude(?!bot) and gpt(?!bot) alternatives never matched, so a bare
          # "claude" or "gpt" passed. The word boundary already keeps "ClaudeBot" and
          # "GPTBot" out, because each is one word.
          BANNED_NAMES='\b(anthropic|haiku|claude|gpt|opus|sonnet|gemini|openai|kimi|qwen|deepseek)\b'
          BANNED_MODEL_IDS='\b(claude-[a-z0-9.-]+|haiku-[0-9.]+|opus-[0-9.]+|sonnet-[0-9.]+|gpt-[a-z0-9.-]+)\b'
          BANNED_JSON_KEYS='"(model_provider|inference_model|model_tier|model_family|model_name)"\s*:\s*"[^"]+"'

          # Matcher self-test: a pattern that cannot match is a gate that cannot fail.
          # Every name in BANNED_NAMES must match as a bare word, in any case, and the
          # two crawler names must pass. It runs before any file is read.
          must_match=(anthropic haiku claude gpt opus sonnet gemini openai kimi qwen deepseek CLAUDE Claude GPT Gpt)
          must_pass=(ClaudeBot claudebot GPTBot gptbot 'User-agent: ClaudeBot' 'User-agent: GPTBot')
          for probe in "${must_match[@]}"; do
            if ! grep -E -i -q "$BANNED_NAMES" <<< "$probe"; then
              echo "::error::Algorithm Protection Gate matcher self-test FAILED: '$probe' must match BANNED_NAMES and does not"
              exit 1
            fi
          done
          for probe in "${must_pass[@]}"; do
            if grep -E -i -q "$BANNED_NAMES" <<< "$probe"; then
              echo "::error::Algorithm Protection Gate matcher self-test FAILED: crawler name '$probe' must pass BANNED_NAMES and does not"
              exit 1
            fi
          done

          violations=0
          violation_log=$(mktemp)

          # Scan every file the host publishes, whatever its extension (pages, JSON,
          # text, CSS, SVG, XML, _headers, _redirects), excluding the legal allow-list;
          # grep -I passes over a binary file, which carries no copy.
          # The scan covers what the host publishes (site/, the build output directory)
          # and the skills draft (skills/, held to the same rule by the COO's 10-15
          # ruling). The repository-only files at the root (CLAUDE.md, README.md,
          # .github/) are not published and not scanned; the publish-folder job below
          # fails if one of them enters site/. That is why the token mask this step
          # once carried for the operating pointer's own file name is gone.
          while IFS= read -r -d '' file; do
            basename=$(basename "$file")
            # Allow-listed legal-substrate files: skip
            if [[ "$basename" =~ $ALLOWLIST_REGEX ]]; then
              continue
            fi
            # Allow-listed crawler directive: skip robots.txt explicitly (also caught above)
            # Now scan for banned-language patterns.
            scan_input="$file"
            matched=0
            if grep -I -E -i -n -H --label="$file" "$BANNED_NAMES" < "$scan_input" >> "$violation_log" 2>/dev/null; then
              matched=1
            fi
            if grep -I -E -i -n -H --label="$file" "$BANNED_MODEL_IDS" < "$scan_input" >> "$violation_log" 2>/dev/null; then
              matched=1
            fi
            if grep -I -E -n -H --label="$file" "$BANNED_JSON_KEYS" < "$scan_input" >> "$violation_log" 2>/dev/null; then
              matched=1
            fi
            if [[ $matched -eq 1 ]]; then
              violations=$((violations + 1))
            fi
          done < <(find site skills -type f -print0)

          if [[ -s "$violation_log" ]]; then
            echo "::error::Algorithm Protection Gate FAILED — banned-language found in customer-facing copy"
            echo ""
            echo "Violations:"
            cat "$violation_log"
            echo ""
            echo "Canonical refs:"
            echo "  - Algorithm_Protection_v1 §6.X NEW (R-3 RATIFIED Pass 2026-05-12)"
            echo "  - Themis #115.3 Pythia-prompt-template-protection (BINDING)"
            echo "  - Themis #117.2 Answer-substrate-protection (R-2 RATIFIED Pass 2026-05-12)"
            echo "  - Themis #117.12 sales-conversation-scope-bounding (BINDING per R-2)"
            echo "  - Pattern-32 27th-instance LIVE-PRODUCT-SURFACE-vs-RATIFIED-CANONICAL-DESIGN class"
            echo "  - Lesson #28-EXTENSION BINDING-CANDIDATE algorithm-substrate non-exposure"
            echo ""
            echo "Remediation:"
            echo "  - Replace underlying-vendor + model-tier mentions with 'Standard Compute tier' / 'Deep Compute tier' / 'Strategic Compute tier' canonical customer-facing abstraction"
            echo "  - Legal substrate (privacy-policy.html, terms-of-service.html, refund-policy.html) is allow-listed for GDPR Article 28 + CCPA subprocessor disclosure"
            echo "  - Crawler directives (robots.txt User-agent: GPTBot/ClaudeBot/anthropic-ai) are allow-listed per robots.txt spec"
            echo ""
            echo "Manual override path:"
            echo "  - PR label 'algo-protection-gate-override' (requires owner approval per §15.6.11 v2 substantial-close-gov-equivalent)"
            exit 1
          fi

          echo "✅ Algorithm Protection Gate PASSED — zero banned-language matches outside legal-substrate + crawler-directive allow-list"
          echo "scrub_count=0" >> "$GITHUB_OUTPUT"

  publish-folder:
    # COO ruling 2026-10-15 (§15.10.761 §2): the site publishes from a subfolder,
    # not ignore rules. The host's build output directory is site/; this job fails
    # when a public file sits at the root (it would silently not be published),
    # when a repository-only name (CLAUDE.md, README.md, skills/, .github/) enters
    # site/ at any depth, or when site/ lacks index.html or 404.html (without a
    # top-level 404.html the host answers an unknown path with the homepage and a
    # 200, and nothing could return 404). It runs its own self-test first.
    name: Publish folder holds only public files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish-folder check (self-test, then the tree)
        run: python3 scripts/site_gates.py publish-folder

  vendor-names:
    # COO ruling 2026-10-15 (§15.10.761 §4 Sites): vendor product names appear on
    # our surfaces only inside ratified strings. The names and the allow-listed
    # ratified occurrences are in gates/vendor_names.json; a fail-tier name outside
    # an allow-listed string fails the job, report-tier names are listed on every
    # run. It runs its own self-test first.
    name: Vendor product names only inside ratified strings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor-name check (self-test, then site/ and skills/)
        run: python3 scripts/site_gates.py vendor-names
